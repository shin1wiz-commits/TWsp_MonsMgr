name: Rebuild Altema Breeding 659

on:
  workflow_dispatch:

jobs:
  rebuild-breeding:
    name: Rebuild 659-monster breeding data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: tools/altema-master
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      - name: Rebuild Altema breeding data
        working-directory: tools/altema-master
        run: |
          python rebuild_altema_breeding.py

      - name: Verify CSV output
        working-directory: tools/altema-master
        run: |
          test -d output_breeding
          test -f output_breeding/altema_breeding_summary.csv
          test -f output_breeding/altema_breeding_diff_vs_current.csv
          echo "Generated files:"
          ls -lh output_breeding

      - name: Create result ZIP
        working-directory: tools/altema-master
        run: |
          rm -f output_breeding.zip
          zip -r output_breeding.zip output_breeding
          test -f output_breeding.zip
          echo "ZIP created successfully:"
          ls -lh output_breeding.zip

      - name: Upload breeding result ZIP
        uses: actions/upload-artifact@v4
        with:
          name: altema-breeding-result
          path: tools/altema-master/output_breeding.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw CSV reports
        uses: actions/upload-artifact@v4
        with:
          name: altema-breeding-csv-reports
          path: tools/altema-master/output_breeding/*.csv
          if-no-files-found: warn
          retention-days: 14
