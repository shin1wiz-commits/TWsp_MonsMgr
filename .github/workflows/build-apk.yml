name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. Find project ZIP
      # ==================================================
      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -not -path '*/.git/*' \
              -not -path '*/.github/*' \
              -printf '%s\t%p\n' 2>/dev/null \
              | sort -nr \
              | head -n 1 \
              | cut -f2-
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found."
            echo
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "========================================"
          echo "Project ZIP found"
          echo "========================================"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 3. Extract project ZIP
      # ==================================================
      - name: Extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/android-project"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          echo "========================================"
          echo "Extracting project ZIP"
          echo "========================================"

          unzip -q \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d "$PROJECT_DIR"

          echo
          echo "Extracted files:"
          find "$PROJECT_DIR" \
            -maxdepth 5 \
            -type f \
            | sort

          echo "project_root=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 4. Locate Android project
      # ==================================================
      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.extract.outputs.project_root }}"

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR:"
            echo "settings.gradle or settings.gradle.kts was not found."
            echo
            echo "Extracted files:"
            find "$ROOT" -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "========================================"
          echo "Android project found"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo
          echo "Project files:"
          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            | sort

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 5. Check Gradle Wrapper
      # ==================================================
      - name: Check Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties was not found."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar was not found."
            exit 1
          fi

          chmod +x ./gradlew

          echo "========================================"
          echo "Gradle Wrapper OK"
          echo "========================================"

          ./gradlew --version


      # ==================================================
      # 6. Check monsters.csv
      # ==================================================
      - name: Check monsters.csv
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          CSV="app/src/main/assets/monsters.csv"
          EXPECTED="no,name,rank,family,size"

          if [ ! -f "$CSV" ]; then
            echo "ERROR:"
            echo "$CSV was not found."
            exit 1
          fi

          echo "========================================"
          echo "monsters.csv found"
          echo "========================================"

          ls -lh "$CSV"

          HEADER="$(
            head -n 1 "$CSV" \
              | sed 's/^\xEF\xBB\xBF//' \
              | tr -d '\r'
          )"

          echo
          echo "CSV header:"
          echo "$HEADER"

          if [ "$HEADER" != "$EXPECTED" ]; then
            echo
            echo "ERROR: Invalid CSV header."
            echo
            echo "Expected:"
            echo "$EXPECTED"
            echo
            echo "Actual:"
            echo "$HEADER"
            exit 1
          fi

          DATA_LINES=$(( $(wc -l < "$CSV") - 1 ))

          echo
          echo "Monster data rows:"
          echo "$DATA_LINES"

          if [ "$DATA_LINES" -ne 659 ]; then
            echo
            echo "ERROR:"
            echo "Expected exactly 659 monster rows."
            echo "Actual: $DATA_LINES"
            exit 1
          fi

          echo
          echo "CSV validation OK."

          echo
          echo "CSV sample:"
          head -n 6 "$CSV"


      # ==================================================
      # 7. Set up Java 17
      #
      # IMPORTANT:
      # Gradle cache is intentionally disabled here.
      #
      # The Android project exists under RUNNER_TEMP after
      # ZIP extraction, not directly inside the checked-out
      # GitHub repository.
      #
      # setup-java's Gradle cache dependency lookup caused
      # the previous build failure.
      # ==================================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 8. Set up Android SDK
      # ==================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # 9. Accept Android SDK licenses
      # ==================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      # ==================================================
      # 10. Build Debug APK
      # ==================================================
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Building Debug APK"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # ==================================================
      # 11. Find APK
      # ==================================================
      - name: Find APK
        id: find_apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for APK"
          echo "========================================"

          APK_FILE="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not found."
            echo
            echo "Build output files:"

            find app/build/outputs \
              -type f \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          APK_ABS="$(realpath "$APK_FILE")"

          echo
          echo "APK found:"
          ls -lh "$APK_ABS"

          echo
          echo "APK path:"
          echo "$APK_ABS"

          echo "apk_file=$APK_ABS" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 12. Upload APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terrysp-monster-manager-debug
          path: ${{ steps.find_apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 14


      # ==================================================
      # 13. Build summary
      # ==================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "TerrySP Monster Manager"
          echo "Build Summary"
          echo "========================================"

          echo
          echo "ZIP:"
          echo "${{ steps.find_zip.outputs.zip_file }}"

          echo
          echo "Android project:"
          echo "${{ steps.locate.outputs.project_dir }}"

          echo
          echo "APK:"
          echo "${{ steps.find_apk.outputs.apk_file }}"
