name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1 || true)

          if [ -n "$ZIP" ]; then
            echo "ZIP=$ZIP" >> "$GITHUB_ENV"
            echo "FOUND_ZIP=true" >> "$GITHUB_ENV"
            echo "Found ZIP: $ZIP"
          else
            echo "FOUND_ZIP=false" >> "$GITHUB_ENV"
            echo "No ZIP found at repository root."
          fi

      - name: Extract project ZIP
        if: env.FOUND_ZIP == 'true'
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "ZIP extraction completed."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ "${FOUND_ZIP:-false}" = "true" ]; then
            ROOT="$GITHUB_WORKSPACE/project"
          else
            ROOT="$GITHUB_WORKSPACE"
          fi

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."

            echo
            echo "Project files:"
            find "$ROOT" -maxdepth 6 -type f | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/gradle/wrapper" ]; then
            echo "ERROR: gradle/wrapper directory not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle Wrapper OK."

      - name: Check monsters.csv
        shell: bash
        run: |
          set -e

          CSV="$PROJECT_DIR/app/src/main/assets/monsters.csv"

          echo "Checking:"
          echo "$CSV"

          if [ ! -f "$CSV" ]; then
            echo "ERROR: monsters.csv not found."
            exit 1
          fi

          echo
          echo "File information:"
          ls -lh "$CSV"

          echo
          echo "Raw first line:"
          head -n 1 "$CSV" | cat -A

          # Remove UTF-8 BOM and CRLF ending.
          HEADER=$(head -n 1 "$CSV" \
            | sed 's/^\xEF\xBB\xBF//' \
            | tr -d '\r')

          EXPECTED="no,name,rank,family,size"

          echo
          echo "Normalized header:"
          echo "$HEADER"

          if [ "$HEADER" != "$EXPECTED" ]; then
            echo
            echo "ERROR: Invalid CSV header."
            echo "Expected:"
            echo "$EXPECTED"
            echo "Actual:"
            echo "$HEADER"
            exit 1
          fi

          echo
          echo "Header OK."

          # Count non-empty data rows.
          ROWS=$(tail -n +2 "$CSV" \
            | tr -d '\r' \
            | grep -c '[^[:space:]]' || true)

          echo "Monster data rows: $ROWS"

          if [ "$ROWS" -ne 659 ]; then
            echo
            echo "ERROR: Expected 659 monster rows."
            echo "Actual: $ROWS"
            exit 1
          fi

          echo
          echo "monsters.csv check OK."
          echo "659 monster records detected."

      - name: Show CSV sample
        shell: bash
        run: |
          set -e

          CSV="$PROJECT_DIR/app/src/main/assets/monsters.csv"

          echo "================================"
          echo "CSV HEAD"
          echo "================================"

          head -n 6 "$CSV"

          echo
          echo "================================"
          echo "CSV TAIL"
          echo "================================"

          tail -n 5 "$CSV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Building Debug APK"
          echo "================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo
            echo "APK output directory:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "================================"
          echo "BUILD SUMMARY"
          echo "================================"
          echo "Project: $PROJECT_DIR"
          echo "CSV: $PROJECT_DIR/app/src/main/assets/monsters.csv"
          echo "Monster records: 659"
          echo "================================"
