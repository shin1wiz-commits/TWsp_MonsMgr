name: Build TerrySP APK (Fixed Signing + Diagnostics)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets safely
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty"
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: KEY_ALIAS is empty"
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: KEY_PASSWORD is empty"
            exit 1
          fi

          echo "Signing secrets are present."

      - name: Find newest TerrySP project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: ZIP file was not found in repository root."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/terrysp_project"
          mkdir -p "$RUNNER_TEMP/terrysp_project"

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" \
            -d "$RUNNER_TEMP/terrysp_project"

          echo "Extracted files:"
          find "$RUNNER_TEMP/terrysp_project" \
            -maxdepth 3 \
            -type f \
            | head -100

      - name: Find Android project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$RUNNER_TEMP/terrysp_project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: Android project root was not found."
            echo "settings.gradle/settings.gradle.kts is missing."
            exit 1
          fi

          echo "Android project root:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle executable permission
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew was not found."
            exit 1
          fi

      - name: Decode fixed release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/TerrySP_fixed_release_v2.keystore"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore decoded successfully."

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify keystore before build
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Checking keystore..."

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore and alias are valid."

      - name: Build fixed-signed Release APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          TERRYSP_KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          TERRYSP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TERRYSP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TERRYSP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew --stop || true

          ./gradlew \
            clean \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Find generated Release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Searching generated APK files..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            ! -name "*unaligned*" \
            | grep -i "release" \
            | head -n 1 || true)"

          if [ -z "${APK_FILE:-}" ]; then
            APK_FILE="$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              ! -name "*unaligned*" \
              | head -n 1 || true)"
          fi

          if [ -z "${APK_FILE:-}" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        env:
          APK_FILE: ${{ steps.apk.outputs.apk_file }}
        run: |
          set -euo pipefail

          echo "Searching Android SDK apksigner..."

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
            -type f \
            -name "apksigner" \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          if [ -z "${APKSIGNER:-}" ]; then
            echo "ERROR: apksigner was not found."
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            exit 1
          fi

          chmod +x "$APKSIGNER"

          echo "Using apksigner:"
          echo "$APKSIGNER"

          echo
          echo "Verifying APK:"
          echo "$APK_FILE"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_FILE"

          echo
          echo "APK signature verification succeeded."

      - name: Prepare APK artifact
        id: artifact
        shell: bash
        env:
          APK_FILE: ${{ steps.apk.outputs.apk_file }}
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"
          OUTPUT_APK="$OUTPUT_DIR/TerrySP-fixed-release.apk"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          cp "$APK_FILE" "$OUTPUT_APK"

          echo "Prepared:"
          ls -lh "$OUTPUT_APK"

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySP-fixed-release
          path: ${{ steps.artifact.outputs.output_dir }}/TerrySP-fixed-release.apk
          if-no-files-found: error
          retention-days: 30
