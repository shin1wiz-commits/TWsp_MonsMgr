name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. ソースコードを取得
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 2. Java 17
      # Android Gradle Plugin 8.6.1 用
      # ========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ========================================
      # 3. Android SDK
      # ========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ========================================
      # 4. Android SDK 35 をインストール
      # compileSdk = 35
      # ========================================
      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ========================================
      # 5. SDKライセンスに同意
      # ========================================
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # ========================================
      # 6. プロジェクト構成を確認
      # ========================================
      - name: Check project structure
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Project files ==="
          find . -maxdepth 3 -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradlew" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print

          echo "=== Required files ==="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Project structure OK."

      # ========================================
      # 7. Gradle Wrapperに実行権限を付与
      # ========================================
      - name: Make Gradle Wrapper executable
        run: |
          chmod +x ./gradlew

      # ========================================
      # 8. Gradleバージョン確認
      # Gradle 8.7
      # ========================================
      - name: Check Gradle version
        run: |
          ./gradlew --version

      # ========================================
      # 9. Debug APKをビルド
      # ========================================
      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ========================================
      # 10. APKが存在するか確認
      # ========================================
      - name: Check APK
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -type f -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully created:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # ========================================
      # 11. APKをArtifactとしてアップロード
      # ========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
