name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$({
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -not -path '*/.git/*' \
              -not -path '*/.github/*' \
              -printf '%s\t%p\n' 2>/dev/null || true
          } | sort -nr | head -n 1 | cut -f2-)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Project ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/android-project"
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d "$PROJECT_DIR"

          echo "Extracted project:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

          echo "project_root=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.extract.outputs.project_root }}"

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found after ZIP extraction."
            echo
            echo "Extracted files:"
            find "$ROOT" -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew || {
            echo "ERROR: gradlew not found."
            exit 1
          }

          test -f ./gradle/wrapper/gradle-wrapper.properties || {
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          }

          chmod +x ./gradlew

          ./gradlew --version

      - name: Check monsters.csv
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          CSV="app/src/main/assets/monsters.csv"
          EXPECTED="no,name,rank,family,size"

          test -f "$CSV" || {
            echo "ERROR: $CSV not found."
            exit 1
          }

          HEADER="$(head -n 1 "$CSV" | sed 's/^\xEF\xBB\xBF//' | tr -d '\r')"

          if [ "$HEADER" != "$EXPECTED" ]; then
            echo "ERROR: Invalid CSV header."
            echo "Expected: $EXPECTED"
            echo "Actual:   $HEADER"
            exit 1
          fi

          DATA_LINES=$(( $(wc -l < "$CSV") - 1 ))

          echo "monsters.csv: $DATA_LINES data rows"

          if [ "$DATA_LINES" -ne 659 ]; then
            echo "ERROR: Expected exactly 659 monster rows."
            exit 1
          fi

          echo "CSV validation OK."

          head -n 5 "$CSV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.project_dir }}/gradle/wrapper/gradle-wrapper.properties
            ${{ steps.locate.outputs.project_dir }}/build.gradle.kts
            ${{ steps.locate.outputs.project_dir }}/settings.gradle.kts
            ${{ steps.locate.outputs.project_dir }}/app/build.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        id: find_apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not found."

            find app/build/outputs \
              -type f \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          APK_ABS="$(realpath "$APK_FILE")"

          echo "APK: $APK_ABS"

          echo "apk_file=$APK_ABS" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terrysp-monster-manager-debug
          path: ${{ steps.find_apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "TerrySP Monster Manager build summary"
          echo "========================================"

          echo "ZIP: ${{ steps.find_zip.outputs.zip_file }}"

          echo "Android project: ${{ steps.locate.outputs.project_dir }}"

          echo "APK: ${{ steps.find_apk.outputs.apk_file }}"
