name: Build TerrySP APK (Fixed Signing)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        shell: bash
        env:
          KS_B64: ${{ secrets.TERRYSP_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.TERRYSP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TERRYSP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TERRYSP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for item in KS_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!item:-}" ]; then
              echo "::error::Required GitHub Actions signing secret is missing: $item"
              exit 1
            fi
          done

      - name: Find newest TerrySP project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'TerrySPMonsterManager*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::TerrySPMonsterManager*.zip was not found in repository root."
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          echo "zip=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/terrysp-project"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q "${{ steps.find_zip.outputs.zip }}" -d "$ROOT"
          SETTINGS="$(find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle/settings.gradle.kts was not found."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore permanent signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.TERRYSP_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.TERRYSP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TERRYSP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TERRYSP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/terrysp_fixed_release.keystore"
          printf '%s' "$KS_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "TERRYSP_SIGNING_STORE_FILE=$KEYSTORE"
            echo "TERRYSP_STORE_PASSWORD=$STORE_PASS"
            echo "TERRYSP_KEY_ALIAS=$KEY_ALIAS"
            echo "TERRYSP_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build fixed-signed Release APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        id: apk
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not found."
            exit 1
          fi
          apksigner verify --verbose --print-certs "$APK"
          ABS="$(realpath "$APK")"
          echo "apk=$ABS" >> "$GITHUB_OUTPUT"
          echo "Fixed-signed APK: $ABS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySP-v2.7.4-fixed-signed
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

