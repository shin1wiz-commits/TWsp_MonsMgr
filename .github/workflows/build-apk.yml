name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 2. Java 17
      # ========================================
      # cache: gradle は使用しない
      # ZIPを展開する前にGradleプロジェクトを
      # 自動検出させないため
      # ========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ========================================
      # 3. Android SDK
      # ========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ========================================
      # 4. ZIPを探す
      # ========================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f -print | sort

          echo ""
          echo "=== Searching for ZIP ==="

          ZIP_FILE="$(find . -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ========================================
      # 5. ZIPを展開
      # ========================================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/_temp"
          mkdir -p "$GITHUB_WORKSPACE/_temp/android-project"

          echo "=== Extracting ==="
          echo "ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/_temp/android-project"

          echo ""
          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/_temp/android-project" \
            -maxdepth 5 -type f -print | sort

      # ========================================
      # 6. Gradleプロジェクトを探す
      # ========================================
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/_temp/android-project"

          echo "=== Searching for settings.gradle ==="

          SETTINGS_FILE="$(find "$ROOT" \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo ""
            echo "=== Extracted directory ==="
            find "$ROOT" -maxdepth 5 -print | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo ""
          echo "Found Gradle project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "=== Project structure ==="
          find "$PROJECT_DIR" -maxdepth 3 -print | sort

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ========================================
      # 7. プロジェクト構成確認
      # ========================================
      - name: Show project structure
        shell: bash
        run: |
          set -e

          echo "=== Gradle project ==="
          echo "$PROJECT_DIR"

          echo ""
          echo "=== Files ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f -print | sort

          echo ""
          echo "=== Root files ==="
          ls -la "$PROJECT_DIR"

      # ========================================
      # 8. Gradle Wrapper確認
      # ========================================
      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Gradle Wrapper found."

      # ========================================
      # 9. Gradle Wrapperを実行可能にする
      # ========================================
      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          set -e
          chmod +x "$PROJECT_DIR/gradlew"

          ls -l "$PROJECT_DIR/gradlew"

      # ========================================
      # 10. Gradleバージョン確認
      # ========================================
      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          ./gradlew --version

      # ========================================
      # 11. Android SDKライセンス
      # ========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # ========================================
      # 12. Debug APKをビルド
      # ========================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== Building Debug APK ==="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ========================================
      # 13. APK確認
      # ========================================
      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="

          find "$PROJECT_DIR" \
            -type f \
            -name '*.apk' \
            -print

          APK_COUNT="$(find "$PROJECT_DIR" \
            -type f \
            -name '*.apk' \
            | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK found: $APK_COUNT"

      # ========================================
      # 14. APKを成果物として準備
      # ========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -name '*-debug.apk' \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/app-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output/app-debug.apk"

      # ========================================
      # 15. APKをGitHub Actionsにアップロード
      # ========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/app-debug.apk
          if-no-files-found: error
