name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP" ]; then
            echo "ZIP=$ZIP" >> "$GITHUB_ENV"
            echo "FOUND_ZIP=true" >> "$GITHUB_ENV"
            echo "Found ZIP: $ZIP"
          else
            echo "FOUND_ZIP=false" >> "$GITHUB_ENV"
            echo "No ZIP at repository root. Using repository files directly."
          fi

      - name: Extract project ZIP
        if: env.FOUND_ZIP == 'true'
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/project"

      - name: Locate Android project
        shell: bash
        run: |
          if [ "${FOUND_ZIP:-false}" = "true" ]; then
            ROOT="$GITHUB_WORKSPACE/project"
          else
            ROOT="$GITHUB_WORKSPACE"
          fi

          SETTINGS=$(find "$ROOT" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "Android settings.gradle/settings.gradle.kts was not found."
            echo "Files under repository:"
            find "$ROOT" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "gradlew not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/gradle/wrapper" ]; then
            echo "gradle/wrapper directory not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle Wrapper OK"

      - name: Check monsters.csv
        shell: bash
        run: |
          CSV="$PROJECT_DIR/app/src/main/assets/monsters.csv"

          if [ ! -f "$CSV" ]; then
            echo "monsters.csv not found:"
            echo "$CSV"
            exit 1
          fi

          echo "monsters.csv found:"
          ls -lh "$CSV"

          HEADER=$(head -n 1 "$CSV")

          if [ "$HEADER" != "no,name,rank,family,size" ]; then
            echo "Invalid CSV header:"
            echo "$HEADER"
            exit 1
          fi

          ROWS=$(tail -n +2 "$CSV" | grep -c . || true)

          echo "Monster rows: $ROWS"

          if [ "$ROWS" -ne 659 ]; then
            echo "Expected 659 monster rows, found $ROWS."
            exit 1
          fi

          echo "CSV check OK"

      - name: Show CSV sample
        shell: bash
        run: |
          echo "----- CSV HEAD -----"
          head -n 5 "$PROJECT_DIR/app/src/main/assets/monsters.csv"

          echo
          echo "----- CSV TAIL -----"
          tail -n 5 "$PROJECT_DIR/app/src/main/assets/monsters.csv"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
