name: build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          while IFS= read -r file; do
            ZIP="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path "*/.git/*"
          )

          if [ -z "$ZIP" ]; then
            echo "ERROR: project ZIP was not found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        id: extract_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.find_zip.outputs.zip }}"
          EXTRACT_DIR="$RUNNER_TEMP/project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting:"
          echo "$ZIP"

          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          echo ""
          echo "Extracted project files:"
          find "$EXTRACT_DIR" -type f | sort

          echo ""
          echo "Extracted to:"
          echo "$EXTRACT_DIR"

          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.extract_zip.outputs.extract_dir }}"

          echo "Searching Android project in:"
          echo "$ROOT"

          SETTINGS=""

          while IFS= read -r file; do
            SETTINGS="$file"
            break
          done < <(
            find "$ROOT" -type f | grep -E '/settings\.gradle(\.kts)?$' || true
          )

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo ""
            echo "Extracted files:"
            find "$ROOT" -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo ""
          echo "========================================"
          echo "Android project found"
          echo "========================================"
          echo "Settings:"
          echo "$SETTINGS"
          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"
          echo "========================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          echo "Checking Gradle Wrapper..."

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties was not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle Wrapper OK"

      - name: Check monsters.csv
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          CSV="$PROJECT_DIR/app/src/main/assets/monsters.csv"

          echo "Checking:"
          echo "$CSV"

          if [ ! -f "$CSV" ]; then
            echo "ERROR: monsters.csv was not found."
            exit 1
          fi

          echo ""
          echo "File:"
          ls -lh "$CSV"

          python3 - "$CSV" <<'PY'
          import csv
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              rows = list(csv.reader(f))

          if not rows:
              raise SystemExit(
                  "ERROR: monsters.csv is empty"
              )

          header = [x.strip() for x in rows[0]]

          expected = [
              "no",
              "name",
              "rank",
              "family",
              "size"
          ]

          if header != expected:
              raise SystemExit(
                  "ERROR: Invalid CSV header:\n"
                  f"Expected: {expected}\n"
                  f"Found:    {header}"
              )

          data = rows[1:]

          if len(data) != 659:
              raise SystemExit(
                  "ERROR: Expected 659 monster rows, "
                  f"but found {len(data)}"
              )

          numbers = []

          for line_number, row in enumerate(data, start=2):

              if len(row) != 5:
                  raise SystemExit(
                      f"ERROR: CSV line {line_number}: "
                      f"expected 5 columns, "
                      f"found {len(row)}"
                  )

              try:
                  number = int(row[0].strip())
              except ValueError:
                  raise SystemExit(
                      f"ERROR: CSV line {line_number}: "
                      f"invalid monster No: {row[0]!r}"
                  )

              numbers.append(number)

          expected_numbers = list(range(1, 660))

          if sorted(numbers) != expected_numbers:
              missing = sorted(
                  set(expected_numbers) - set(numbers)
              )

              duplicated = sorted(
                  {
                      n for n in numbers
                      if numbers.count(n) > 1
                  }
              )

              raise SystemExit(
                  "ERROR: Monster numbers are invalid.\n"
                  f"Missing: {missing}\n"
                  f"Duplicated: {duplicated}"
              )

          print("")
          print("========================================")
          print("monsters.csv OK")
          print("659 monsters verified")
          print("No.1 through No.659 verified")
          print("========================================")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "========================================"
          echo "Building Debug APK"
          echo "========================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          APK=""

          while IFS= read -r file; do
            APK="$file"
            break
          done < <(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" || true
          )

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "APK output directory:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-debug
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          echo "## Build successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Android project located successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "monsters.csv: 659 records verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Debug APK generated successfully." >> "$GITHUB_STEP_SUMMARY"
