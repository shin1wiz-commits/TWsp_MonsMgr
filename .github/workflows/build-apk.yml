name: Build TerrySP APK (Fixed Signing + Diagnostics)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets safely
        shell: bash
        env:
          TERRYSP_KEYSTORE_BASE64: ${{ secrets.TERRYSP_KEYSTORE_BASE64 }}
          TERRYSP_STORE_PASSWORD: ${{ secrets.TERRYSP_STORE_PASSWORD }}
          TERRYSP_KEY_ALIAS: ${{ secrets.TERRYSP_KEY_ALIAS }}
          TERRYSP_KEY_PASSWORD: ${{ secrets.TERRYSP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "${TERRYSP_KEYSTORE_BASE64:-}" ] || {
            echo "ERROR: TERRYSP_KEYSTORE_BASE64 is empty"
            exit 1
          }

          [ -n "${TERRYSP_STORE_PASSWORD:-}" ] || {
            echo "ERROR: TERRYSP_STORE_PASSWORD is empty"
            exit 1
          }

          [ -n "${TERRYSP_KEY_ALIAS:-}" ] || {
            echo "ERROR: TERRYSP_KEY_ALIAS is empty"
            exit 1
          }

          [ -n "${TERRYSP_KEY_PASSWORD:-}" ] || {
            echo "ERROR: TERRYSP_KEY_PASSWORD is empty"
            exit 1
          }

          echo "All signing secrets are present."

      - name: Find newest TerrySP project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: ZIP file was not found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/terrysp_project"
          mkdir -p "$RUNNER_TEMP/terrysp_project"

          unzip -q \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d "$RUNNER_TEMP/terrysp_project"

          echo "Project extracted."

      - name: Find Android project root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$RUNNER_TEMP/terrysp_project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: Android project root was not found."
            exit 1
          fi

          echo "Project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle executable permission
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Decode fixed release keystore
        shell: bash
        env:
          TERRYSP_KEYSTORE_BASE64: ${{ secrets.TERRYSP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/TerrySP_fixed_release_v2.keystore"

          printf '%s' "$TERRYSP_KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore decoded successfully."

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify keystore before build
        shell: bash
        env:
          TERRYSP_STORE_PASSWORD: ${{ secrets.TERRYSP_STORE_PASSWORD }}
          TERRYSP_KEY_ALIAS: ${{ secrets.TERRYSP_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$TERRYSP_STORE_PASSWORD" \
            -alias "$TERRYSP_KEY_ALIAS" \
            >/dev/null

          echo "Keystore and alias are valid."

      - name: Build Release APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew --stop || true

          ./gradlew \
            clean \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Find unsigned Release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Generated APK files:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -name "*release*unsigned*.apk" \
            | head -n 1 || true)"

          if [ -z "${APK_FILE:-}" ]; then
            APK_FILE="$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | grep -i release \
              | head -n 1 || true)"
          fi

          if [ -z "${APK_FILE:-}" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          echo "Unsigned APK:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Find Android signing tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path is not defined."
            exit 1
          fi

          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          if [ -z "${BUILD_TOOLS_DIR:-}" ]; then
            echo "ERROR: Android build-tools not found."
            exit 1
          fi

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          if [ ! -f "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          echo "Build tools:"
          echo "$BUILD_TOOLS_DIR"

          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"
          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"

      - name: Zipalign Release APK
        id: aligned
        shell: bash
        env:
          APK_FILE: ${{ steps.apk.outputs.apk_file }}
          ZIPALIGN: ${{ steps.tools.outputs.zipalign }}
        run: |
          set -euo pipefail

          ALIGNED_APK="$RUNNER_TEMP/TerrySP-aligned.apk"

          rm -f "$ALIGNED_APK"

          echo "Aligning APK..."

          "$ZIPALIGN" \
            -f \
            -v \
            4 \
            "$APK_FILE" \
            "$ALIGNED_APK"

          if [ ! -s "$ALIGNED_APK" ]; then
            echo "ERROR: zipalign did not create APK."
            exit 1
          fi

          echo "Aligned APK created:"
          ls -lh "$ALIGNED_APK"

          echo "aligned_apk=$ALIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Sign Release APK
        id: signed
        shell: bash
        env:
          APKSIGNER: ${{ steps.tools.outputs.apksigner }}
          ALIGNED_APK: ${{ steps.aligned.outputs.aligned_apk }}
          TERRYSP_STORE_PASSWORD: ${{ secrets.TERRYSP_STORE_PASSWORD }}
          TERRYSP_KEY_ALIAS: ${{ secrets.TERRYSP_KEY_ALIAS }}
          TERRYSP_KEY_PASSWORD: ${{ secrets.TERRYSP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNED_APK="$RUNNER_TEMP/TerrySP-fixed-release.apk"

          rm -f "$SIGNED_APK"

          echo "Signing APK..."

          bash "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$TERRYSP_KEY_ALIAS" \
            --ks-pass "pass:$TERRYSP_STORE_PASSWORD" \
            --key-pass "pass:$TERRYSP_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          if [ ! -s "$SIGNED_APK" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "Signed APK created:"
          ls -lh "$SIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK
        shell: bash
        env:
          APKSIGNER: ${{ steps.tools.outputs.apksigner }}
          SIGNED_APK: ${{ steps.signed.outputs.signed_apk }}
        run: |
          set -euo pipefail

          echo "Verifying signed APK:"
          echo "$SIGNED_APK"

          bash "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          echo
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY."

      - name: Prepare APK artifact
        id: artifact
        shell: bash
        env:
          SIGNED_APK: ${{ steps.signed.outputs.signed_apk }}
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"
          OUTPUT_APK="$OUTPUT_DIR/TerrySP-fixed-release.apk"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          cp "$SIGNED_APK" "$OUTPUT_APK"

          echo "Final APK:"
          ls -lh "$OUTPUT_APK"

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySP-fixed-release
          path: ${{ steps.artifact.outputs.output_dir }}/TerrySP-fixed-release.apk
          if-no-files-found: error
          retention-days: 30
