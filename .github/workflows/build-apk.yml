name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname '*.zip' \
            -not -path '*/.git/*' \
            | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo 'ERROR: project ZIP was not found.'
            echo 'Put the Android project ZIP in the repository.'
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        id: extract_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.find_zip.outputs.zip }}"
          EXTRACT_DIR="$RUNNER_TEMP/project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting:"
          echo "$ZIP"

          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          echo "Extracted files:"
          find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -n 300

          echo "Extracted to: $EXTRACT_DIR"
          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.extract_zip.outputs.extract_dir }}"

          SETTINGS="$(
            find "$ROOT" \
              -type f \
              -name 'settings.gradle' -o -name 'settings.gradle.kts' \
              -print -quit || true
          )"

          if [ -z "$SETTINGS" ]; then
            echo 'ERROR: settings.gradle or settings.gradle.kts was not found after ZIP extraction.'
            echo ''
            echo 'Extracted files:'
            find "$ROOT" -maxdepth 6 -type f | sort | head -n 500
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo 'ERROR: gradlew was not found.'
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo 'ERROR: Gradle Wrapper properties were not found.'
            exit 1
          fi

          echo 'Gradle Wrapper OK'

      - name: Check monsters.csv
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          CSV="$PROJECT_DIR/app/src/main/assets/monsters.csv"

          if [ ! -f "$CSV" ]; then
            echo "ERROR: monsters.csv was not found:"
            echo "$CSV"
            exit 1
          fi

          echo "monsters.csv found:"
          ls -lh "$CSV"

          python3 - "$CSV" <<'PY'
          import csv
          import sys

          path = sys.argv[1]

          with open(
              path,
              'r',
              encoding='utf-8-sig',
              newline=''
          ) as f:
              rows = list(csv.reader(f))

          if not rows:
              raise SystemExit(
                  'ERROR: monsters.csv is empty'
              )

          header = [x.strip() for x in rows[0]]

          expected = [
              'no',
              'name',
              'rank',
              'family',
              'size'
          ]

          if header != expected:
              raise SystemExit(
                  f'ERROR: Invalid CSV header: {header!r}'
              )

          data = rows[1:]

          if len(data) != 659:
              raise SystemExit(
                  f'ERROR: Expected 659 monster rows, found {len(data)}'
              )

          numbers = []

          for line_number, row in enumerate(data, start=2):

              if len(row) != 5:
                  raise SystemExit(
                      f'ERROR: line {line_number}: '
                      f'expected 5 columns, found {len(row)}'
                  )

              try:
                  number = int(row[0].strip())
              except ValueError:
                  raise SystemExit(
                      f'ERROR: line {line_number}: '
                      f'invalid No: {row[0]!r}'
                  )

              numbers.append(number)

          expected_numbers = list(range(1, 660))

          if sorted(numbers) != expected_numbers:
              raise SystemExit(
                  'ERROR: monster No. must contain '
                  'every value from 1 through 659 exactly once'
              )

          print(
              'CSV OK: '
              'header + 659 rows + No.1..659 verified'
          )
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              | head -n 1 || true
          )"

          if [ -z "$APK" ]; then
            echo 'ERROR: APK was not generated.'
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-debug
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          echo '## Build successful' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '659件の monsters.csv を検証しました。' >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug APK を正常に生成しました。
