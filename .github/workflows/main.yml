name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHubリポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. プロジェクトZIPを探す
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "=== ZIP files ==="
          find . -maxdepth 3 -type f -iname "*.zip" -print

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      # 4. ZIPを一時ディレクトリへ展開
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/_temp"
          mkdir -p "$GITHUB_WORKSPACE/_temp/android-project"

          echo "=== Extracting ==="
          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/_temp/android-project"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/_temp/android-project" \
            -maxdepth 4 -type f | sort | head -n 200

      # 5. settings.gradle / settings.gradle.kts を探す
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/_temp/android-project"

          echo "=== Searching for settings.gradle ==="

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "=== Extracted directory ==="
            find "$ROOT" -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "=== Gradle project found ==="
          echo "SETTINGS_FILE=$SETTINGS_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Gradle Wrapperの存在確認
      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          echo "=== Project directory ==="
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "=== Project files ==="
          ls -la

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Gradle Wrapper OK."

      # 7. gradlewを実行可能にする
      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ls -l ./gradlew

      # 8. Gradleバージョン確認
      - name: Check Gradle version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew --version

      # 9. Debug APKをビルド
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Gradle project ==="
          pwd

          echo "=== settings.gradle ==="
          if [ -f "settings.gradle.kts" ]; then
            cat settings.gradle.kts
          elif [ -f "settings.gradle" ]; then
            cat settings.gradle
          fi

          echo "=== Build Debug APK ==="

          ./gradlew assembleDebug \
            --stacktrace \
            --info

      # 10. APKが生成されたか確認
      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK_COUNT=$APK_COUNT"

      # 11. APKをartifact用ディレクトリへコピー
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          echo "=== APK output ==="
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      # 12. APKをGitHub Actionsからダウンロード可能にする
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
