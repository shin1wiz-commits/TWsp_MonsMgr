name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # 1. リポジトリを取得
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------
      # 2. Java 17
      # --------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------
      # 3. ZIPを探す
      # --------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "=== ZIP files ==="
          find . -type f -name "*.zip" -print

          ZIP_FILE=$(find . -type f \
            -name "TerrySPMonsterManager-With-GradleWrapper.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TerrySPMonsterManager-With-GradleWrapper.zip not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP:"
          echo "$ZIP_FILE"

      # --------------------------------
      # 4. ZIPを展開
      # --------------------------------
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/android-project"
          mkdir -p "$RUNNER_TEMP/android-project"

          echo "=== Extracting ZIP ==="
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android-project"

          echo "=== Extracted files ==="
          find "$RUNNER_TEMP/android-project" -maxdepth 5 -type f | sort | head -200

      # --------------------------------
      # 5. settings.gradleを探して
      #    Gradleプロジェクトのルートを決定
      # --------------------------------
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          BASE="$RUNNER_TEMP/android-project"

          echo "=== Searching for settings.gradle ==="

          SETTINGS_FILE=$(find "$BASE" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "=== Extracted directory ==="
            find "$BASE" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "SETTINGS_FILE=$SETTINGS_FILE"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # --------------------------------
      # 6. Gradle Wrapperを確認
      # --------------------------------
      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          echo "=== Project root ==="
          echo "$PROJECT_ROOT"

          echo "=== Project files ==="
          ls -la "$PROJECT_ROOT"

          if [ ! -f "$PROJECT_ROOT/gradlew" ]; then
            echo "ERROR: gradlew not found."
            echo "The ZIP must contain gradlew in the same directory as settings.gradle."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Gradle Wrapper files OK."

      # --------------------------------
      # 7. gradlewを実行可能にする
      # --------------------------------
      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          set -e

          chmod +x "$PROJECT_ROOT/gradlew"

          ls -l "$PROJECT_ROOT/gradlew"

      # --------------------------------
      # 8. Gradleバージョン確認
      # --------------------------------
      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          ./gradlew --version

      # --------------------------------
      # 9. Debug APKをビルド
      # --------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          ./gradlew assembleDebug --stacktrace

      # --------------------------------
      # 10. APK確認
      # --------------------------------
      - name: Check APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="

          find . -type f -name "*.apk" -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully."

      # --------------------------------
      # 11. APKをArtifactとしてアップロード
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-debug-apk
          path: |
            ${{ env.PROJECT_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
