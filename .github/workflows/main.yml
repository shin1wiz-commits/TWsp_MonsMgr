name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find project ZIP
        run: |
          echo "=== ZIP files ==="
          find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" -print

          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*With_GradleWrapper*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Gradle Wrapper ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f | sort | head -100

      - name: Find Gradle project
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Project files ==="
          ls -la

          echo "=== Gradle Wrapper ==="
          ls -la gradlew
          ls -la gradle/wrapper/

      - name: Make Gradle Wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-Debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
