name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. GitHubリポジトリを取得
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Java 17
      # ----------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------
      # 3. Android SDK
      # ----------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------------------
      # 4. ZIPファイルを探す
      # ----------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "=== ZIP files ==="
          find . -type f -iname "*.zip" -print

          ZIP_FILE="$(find . -type f -iname "*.zip" -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Gradle project ZIP not found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ----------------------------------------
      # 5. ZIPを展開
      # ----------------------------------------
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/_temp"
          mkdir -p "$GITHUB_WORKSPACE/_temp/android-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/_temp/android-project"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/_temp/android-project" \
            -maxdepth 4 -type f | head -200

      # ----------------------------------------
      # 6. settings.gradle(.kts)からGradleプロジェクトを探す
      # ----------------------------------------
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SEARCH_ROOT="$GITHUB_WORKSPACE/_temp/android-project"

          echo "=== Searching for settings.gradle ==="

          SETTINGS_FILE="$(find "$SEARCH_ROOT" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo
            echo "=== Extracted directory ==="
            find "$SEARCH_ROOT" -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ----------------------------------------
      # 7. プロジェクト構成を確認
      # ----------------------------------------
      - name: Show project structure
        shell: bash
        run: |
          set -e

          echo "=== Project directory ==="
          echo "$PROJECT_DIR"

          echo
          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 3 -type f -print | sort

      # ----------------------------------------
      # 8. Gradle Wrapper確認
      # ----------------------------------------
      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            echo
            echo "Files in project:"
            ls -la
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Gradle Wrapper found."

      # ----------------------------------------
      # 9. gradlewを実行可能にする
      # ----------------------------------------
      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ls -l ./gradlew

      # ----------------------------------------
      # 10. Gradleバージョン確認
      # ----------------------------------------
      - name: Check Gradle version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew --version

      # ----------------------------------------
      # 11. Android SDKライセンス
      # ----------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # ----------------------------------------
      # 12. APKをビルド
      # ----------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Building Debug APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ----------------------------------------
      # 13. APKを探す
      # ----------------------------------------
      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK found successfully."

      # ----------------------------------------
      # 14. APKをGitHub Actionsの成果物にする
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk
          if-no-files-found: error
