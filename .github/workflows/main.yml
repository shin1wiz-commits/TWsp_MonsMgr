name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # ZIPを確実に探す
      # --------------------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "=== Repository root ==="
          pwd
          ls -lah "$GITHUB_WORKSPACE"

          echo "=== ZIP files ==="
          find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP path does not exist:"
            echo "$ZIP"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # ZIPを展開
      # --------------------------------------------------
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          echo "Extracting:"
          echo "$ZIP"

          unzip -q -o "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f | head -100

      # --------------------------------------------------
      # Android / Gradle プロジェクトを探す
      # --------------------------------------------------
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          echo "=== Searching for settings.gradle ==="

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "=== Extracted directory ==="
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # Gradle Wrapperを確認
      # --------------------------------------------------
      - name: Check Gradle Wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== Gradle project ==="
          pwd

          echo "=== Project files ==="
          ls -lah

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Gradle Wrapper found."

      # --------------------------------------------------
      # gradlewを実行可能にする
      # --------------------------------------------------
      - name: Make Gradle Wrapper executable
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          chmod +x ./gradlew
          ls -l ./gradlew

      # --------------------------------------------------
      # Gradleバージョン確認
      # --------------------------------------------------
      - name: Check Gradle version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          ./gradlew --version

      # --------------------------------------------------
      # Debug APKをビルド
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          ./gradlew assembleDebug --stacktrace

      # --------------------------------------------------
      # APK確認
      # --------------------------------------------------
      - name: Check APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== APK files ==="

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find . \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # --------------------------------------------------
      # APKをArtifactとしてアップロード
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
