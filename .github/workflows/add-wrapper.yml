name: Add Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  add-wrapper:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Find input ZIP
      # ----------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Searching for input ZIP ==="

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            ! -name "TerrySPMonsterManager_With_GradleWrapper.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Input ZIP file not found."
            echo "Files in workspace:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Found input ZIP:"
          echo "$ZIP"

          echo "INPUT_ZIP=$ZIP" >> "$GITHUB_ENV"

      # ----------------------------------------
      # 3. Extract project
      # ----------------------------------------
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          echo "=== Extracting ZIP ==="

          unzip -q -o "$INPUT_ZIP" \
            -d "$GITHUB_WORKSPACE/project"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/project" \
            -maxdepth 3 \
            -type f | head -100

      # ----------------------------------------
      # 4. Find Android project
      # ----------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Searching for Gradle settings ==="

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."

            echo "Searching project tree:"
            find "$GITHUB_WORKSPACE/project" \
              -maxdepth 5 \
              -type f | sort | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Settings file:"
          echo "$SETTINGS"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ----------------------------------------
      # 5. Set up Java
      # ----------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ----------------------------------------
      # 6. Set up Gradle
      # ----------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ----------------------------------------
      # 7. Generate Gradle Wrapper
      # ----------------------------------------
      - name: Generate Gradle Wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=== Generating Gradle Wrapper ==="

          gradle wrapper --gradle-version 8.7

          echo "=== Checking Wrapper ==="

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew was not created."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar was not created."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties was not created."
            exit 1
          fi

          chmod +x gradlew

          echo "Wrapper files:"
          ls -lah gradlew
          ls -lah gradle/wrapper/

      # ----------------------------------------
      # 8. Create ZIP
      # ----------------------------------------
      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Preparing ZIP ==="

          # ZIP専用の一時ディレクトリ
          ZIP_DIR="$RUNNER_TEMP/terrysp_zip_output"

          # 最終ファイル名
          ZIP_NAME="TerrySPMonsterManager_With_GradleWrapper.zip"

          # ZIPの完全なパス
          ZIP_PATH="$ZIP_DIR/$ZIP_NAME"

          # 古いものを完全削除
          rm -rf "$ZIP_DIR"
          mkdir -p "$ZIP_DIR"

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "ZIP_PATH:"
          echo "$ZIP_PATH"

          # プロジェクトディレクトリへ移動
          cd "$PROJECT_DIR"

          echo "=== Creating ZIP ==="

          # プロジェクト自身のZIPや不要ファイルを除外
          zip -r "$ZIP_PATH" . \
            -x "*.zip" \
            -x ".gradle/*" \
            -x "build/*" \
            -x "**/build/*"

          echo "=== ZIP command finished ==="

          # ZIPが本当に存在するか確認
          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERROR: ZIP file was not created."
            echo "Contents of ZIP directory:"
            ls -lah "$ZIP_DIR"
            exit 1
          fi

          # ZIPサイズ確認
          if [ ! -s "$ZIP_PATH" ]; then
            echo "ERROR: ZIP file is empty."
            exit 1
          fi

          echo "=== ZIP successfully created ==="
          ls -lh "$ZIP_PATH"

          # Workspaceへコピー
          cp "$ZIP_PATH" \
            "$GITHUB_WORKSPACE/$ZIP_NAME"

          echo "=== ZIP copied to workspace ==="

          ls -lh \
            "$GITHUB_WORKSPACE/$ZIP_NAME"

          # 環境変数として保存
          echo "OUTPUT_ZIP=$GITHUB_WORKSPACE/$ZIP_NAME" >> "$GITHUB_ENV"

      # ----------------------------------------
      # 9. Verify ZIP
      # ----------------------------------------
      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verifying final ZIP ==="

          if [ ! -f "$OUTPUT_ZIP" ]; then
            echo "ERROR: Final ZIP does not exist."
            echo "Workspace contents:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "ZIP:"
          ls -lh "$OUTPUT_ZIP"

          echo "=== Testing ZIP integrity ==="

          unzip -t "$OUTPUT_ZIP"

          echo "=== Checking Gradle Wrapper inside ZIP ==="

          unzip -l "$OUTPUT_ZIP" | grep -E \
            'gradlew|gradle/wrapper/gradle-wrapper.jar|gradle/wrapper/gradle-wrapper.properties'

          echo "=== ZIP verification successful ==="

      # ----------------------------------------
      # 10. Upload artifact
      # ----------------------------------------
      - name: Upload new ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-With-GradleWrapper
          path: ${{ env.OUTPUT_ZIP }}
          if-no-files-found: error
