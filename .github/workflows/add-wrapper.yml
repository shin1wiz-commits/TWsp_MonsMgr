name: Add Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  add-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "Project extracted."

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Generating Gradle Wrapper ==="

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          echo ""
          echo "=== Checking Wrapper ==="

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "gradlew:"
          ls -lh gradlew

          echo ""
          echo "gradle/wrapper:"
          ls -lh gradle/wrapper/

          echo ""
          echo "Gradle Wrapper generated successfully."

      - name: Create ZIP
        shell: bash
        run: |
          OUTPUT="$RUNNER_TEMP/TerrySPMonsterManager_With_GradleWrapper.zip"

          echo "=== Creating ZIP ==="
          echo "Output:"
          echo "$OUTPUT"

          rm -f "$OUTPUT"

          cd "$PROJECT_DIR"

          zip -r "$OUTPUT" . \
            -x ".gradle/*" \
            -x "build/*" \
            -x "app/build/*"

          echo ""
          echo "=== ZIP command finished ==="

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: ZIP file was not created."
            echo ""
            echo "RUNNER_TEMP:"
            ls -la "$RUNNER_TEMP"
            exit 1
          fi

          echo ""
          echo "=== ZIP successfully created ==="
          ls -lh "$OUTPUT"

          echo "OUTPUT=$OUTPUT" >> "$GITHUB_ENV"

      - name: Check ZIP contents
        shell: bash
        run: |
          echo "=== Checking ZIP contents ==="

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: Output ZIP does not exist:"
            echo "$OUTPUT"
            exit 1
          fi

          unzip -t "$OUTPUT"

          echo ""
          echo "=== Checking Gradle Wrapper ==="

          if ! unzip -l "$OUTPUT" | grep -q "gradlew"; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

          if ! unzip -l "$OUTPUT" | grep -q "gradle/wrapper/gradle-wrapper.jar"; then
            echo "ERROR: gradle-wrapper.jar not found in ZIP"
            exit 1
          fi

          if ! unzip -l "$OUTPUT" | grep -q "gradle/wrapper/gradle-wrapper.properties"; then
            echo "ERROR: gradle-wrapper.properties not found in ZIP"
            exit 1
          fi

          echo ""
          echo "=== ZIP CHECK SUCCESS ==="
          echo "Gradle Wrapper is inside the ZIP."

      - name: Upload new ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-With-GradleWrapper
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
