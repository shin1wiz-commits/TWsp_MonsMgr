name: Add Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  add-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            ! -name "TerrySPMonsterManager_With_GradleWrapper.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Input ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project ==="
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== Generate Gradle Wrapper ==="

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          echo "=== Check Wrapper ==="

          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Wrapper files:"
          ls -lh gradlew
          ls -lh gradlew.bat
          ls -lh gradle/wrapper/

      - name: Create ZIP
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/TerrySPMonsterManager_With_GradleWrapper.zip"

          echo "=== ZIP output ==="
          echo "$OUTPUT"

          rm -f "$OUTPUT"

          echo "=== Creating ZIP ==="

          cd "$PROJECT_DIR"

          zip -r "$OUTPUT" . \
            -x ".gradle/*" \
            -x "build/*" \
            -x "app/build/*" \
            -x ".idea/*"

          echo "=== ZIP command finished ==="

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: ZIP file was not created"
            exit 1
          fi

          echo "=== ZIP created successfully ==="
          ls -lh "$OUTPUT"

      - name: Check ZIP contents
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/TerrySPMonsterManager_With_GradleWrapper.zip"

          echo "=== Check ZIP ==="
          ls -lh "$OUTPUT"

          echo "=== Test ZIP ==="
          unzip -t "$OUTPUT"

          echo "=== Check Gradle Wrapper in ZIP ==="

          unzip -l "$OUTPUT" | grep "gradlew"
          unzip -l "$OUTPUT" | grep "gradle/wrapper/gradle-wrapper.jar"
          unzip -l "$OUTPUT" | grep "gradle/wrapper/gradle-wrapper.properties"

          echo "=== ZIP check successful ==="

      - name: Upload new ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-With-GradleWrapper
          path: ${{ github.workspace }}/TerrySPMonsterManager_With_GradleWrapper.zip
          if-no-files-found: error
