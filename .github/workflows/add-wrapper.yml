name: Add Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  add-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found: $ZIP"

      - name: Extract project
        run: |
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/project"

      - name: Find Android project
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -name "settings.gradle*" \
            -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle or settings.gradle.kts not found"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.7

          echo "=== Wrapper files ==="
          ls -lh gradlew
          ls -lh gradle/wrapper/

      - name: Create new ZIP
        run: |
          OUTPUT="$GITHUB_WORKSPACE/TerrySPMonsterManager_With_GradleWrapper.zip"

          rm -f "$OUTPUT"

          cd "$PROJECT_DIR"

          zip -r "$OUTPUT" . \
            -x ".gradle/*" \
               "build/*" \
               "**/build/*" \
               "*.zip"

          echo "=== ZIP created ==="
          ls -lh "$OUTPUT"

          echo "=== ZIP contents ==="
          unzip -l "$OUTPUT" | grep -E \
            '(^|/)(gradlew|gradle/wrapper/gradle-wrapper.jar|gradle/wrapper/gradle-wrapper.properties)$' \
            || true

      - name: Upload new ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-With-GradleWrapper
          path: ${{ github.workspace }}/TerrySPMonsterManager_With_GradleWrapper.zip
          if-no-files-found: error
