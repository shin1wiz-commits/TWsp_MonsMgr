name: Add Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  add-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found: $ZIP"

      - name: Extract project
        run: |
          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP" \
            -d "$GITHUB_WORKSPACE/project"

      - name: Find Android project
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -name "settings.gradle*" \
            -type f \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.7

          echo "=== Gradle Wrapper ==="
          ls -lh gradlew
          ls -lh gradle/wrapper/

      - name: Create new ZIP
        run: |
          cd "$PROJECT_DIR"

          OUTPUT="$GITHUB_WORKSPACE/TerrySPMonsterManager_With_GradleWrapper.zip"

          rm -f "$OUTPUT"

          echo "Creating ZIP..."

          zip -r "$OUTPUT" . \
            -x ".gradle/*" \
            -x "*/.gradle/*" \
            -x "build/*" \
            -x "*/build/*" \
            -x "*.zip"

          echo "ZIP creation finished."

          echo "Checking ZIP contents..."

          unzip -l "$OUTPUT" | grep "gradlew"

          unzip -l "$OUTPUT" | grep "gradle/wrapper/gradle-wrapper.jar"

          unzip -l "$OUTPUT" | grep "gradle/wrapper/gradle-wrapper.properties"

          echo "Gradle Wrapper ZIP is ready."

      - name: Upload new ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-With-GradleWrapper
          path: ${{ github.workspace }}/TerrySPMonsterManager_With_GradleWrapper.zip
          if-no-files-found: error
