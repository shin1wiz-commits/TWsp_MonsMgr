name: Add Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  add-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            ! -name "TerrySPMonsterManager_With_GradleWrapper.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Original ZIP not found"
            exit 1
          fi

          echo "Input ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "Extraction completed."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== Generating Gradle Wrapper ==="

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          echo "=== Wrapper check ==="

          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Wrapper generated successfully."

          ls -lh gradlew
          ls -lh gradle/wrapper/

      - name: Create ZIP
        shell: bash
        run: |
          set -e

          echo "=== Preparing ZIP ==="

          cd "$PROJECT_DIR"

          # ZIPをプロジェクトの外側に作る
          rm -f ../TerrySPMonsterManager_With_GradleWrapper.zip

          echo "Current directory:"
          pwd

          echo "Creating ZIP..."

          zip -r ../TerrySPMonsterManager_With_GradleWrapper.zip . \
            -x ".gradle/*" \
            -x "build/*" \
            -x "app/build/*" \
            -x ".idea/*"

          echo "=== ZIP command finished ==="

          cd ..

          echo "=== Files in parent directory ==="
          ls -lah

          if [ ! -f "TerrySPMonsterManager_With_GradleWrapper.zip" ]; then
            echo "ERROR: ZIP file was not created."
            exit 1
          fi

          echo "=== ZIP successfully created ==="
          ls -lh TerrySPMonsterManager_With_GradleWrapper.zip

          # GitHub Workspaceへ移動
          cp TerrySPMonsterManager_With_GradleWrapper.zip \
             "$GITHUB_WORKSPACE/TerrySPMonsterManager_With_GradleWrapper.zip"

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/TerrySPMonsterManager_With_GradleWrapper.zip"

          echo "=== Final ZIP ==="
          ls -lh "$ZIP"

          echo "=== Testing ZIP ==="
          unzip -t "$ZIP"

          echo "=== Checking Gradle Wrapper ==="

          unzip -l "$ZIP" | grep "gradlew"
          unzip -l "$ZIP" | grep "gradle/wrapper/gradle-wrapper.jar"
          unzip -l "$ZIP" | grep "gradle/wrapper/gradle-wrapper.properties"

          echo "=== ZIP verification successful ==="

      - name: Upload new ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TerrySPMonsterManager-With-GradleWrapper
          path: ${{ github.workspace }}/TerrySPMonsterManager_With_GradleWrapper.zip
          if-no-files-found: error
